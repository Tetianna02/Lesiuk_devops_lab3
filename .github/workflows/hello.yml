
name: Hello Workflow

on:
  push:
    branches: [ main ]

jobs:
  hello-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Say Hello
        run: echo "Hello from GitHub Actions!"

      - name: Show repo info
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Run number: $GITHUB_RUN_NUMBER"

